server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_URL:http://auth-service:8081}/api/v1/auth/.well-known/jwks.json

  cloud: 
    gateway:
      routes:

        - id: auth-service-api
          uri: ${AUTH_SERVICE_URL:http://auth-service:8081}
          predicates: 
            - Path=/api/v1/auth/**